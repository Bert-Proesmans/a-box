[project]
name = "agentvm"
version = "0.0.1"
description = "Orchestration CLI for isolated LLM code-agent Firecracker microVMs"
requires-python = ">=3.11"
dependencies = ["click"]

[project.scripts]
agentvm = "agentvm.cli:main"

[project.optional-dependencies]
dev = ["pytest", "mypy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

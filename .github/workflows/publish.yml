# GitHub Actions workflow "publish", run on push to main or manually, serialized in concurrency group
# "publish". Builds the main system's toplevel and the publish tool, then runs a-box-publish,
# uploading to B2 nix-cache and the pointerUrl path (rejected if outside storage.proesmans.eu),
# signed with NIX_SIGNING_KEY.
# Secrets: NIX_SIGNING_KEY, B2_KEY_ID, B2_APPLICATION_KEY. Variables: B2_BUCKET.

name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Build
        run: |
          nix-build -A toplevel -o result-toplevel
          nix-build -A publish -o result-publish

      - name: Publish
        env:
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
          RCLONE_CONFIG_B2_TYPE: b2
          RCLONE_CONFIG_B2_ACCOUNT: ${{ secrets.B2_KEY_ID }}
          RCLONE_CONFIG_B2_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          export A_BOX_SIGNING_KEY="$RUNNER_TEMP/cache.sec"
          printf '%s' "$NIX_SIGNING_KEY" > "$A_BOX_SIGNING_KEY"

          # The pointer goes where the updater reads it: pointerUrl relative to the bucket's URL.
          storage=https://storage.proesmans.eu/
          url=$(nix-instantiate --eval --json -A pointerUrl | jq -r .)
          if [[ $url != "$storage"* ]]; then
            echo "pointerUrl ($url) is outside $storage" >&2
            exit 1
          fi

          A_BOX_CACHE_DEST="b2:${{ vars.B2_BUCKET }}/nix-cache" \
          A_BOX_POINTER_DEST="b2:${{ vars.B2_BUCKET }}/${url#"$storage"}" \
            ./result-publish/bin/a-box-publish result-toplevel

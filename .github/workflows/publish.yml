# GitHub Actions workflow "publish", run manually, serialized in concurrency group "publish".
# Building and uploading are separate jobs on separate runners:
#
#   build   builds the main system, stages it with a-box-stage, signed with NIX_SIGNING_KEY,
#      |    and hands the stage over as workflow artifact "stage"
#      v
#   upload  uploads the artifact with a-box-upload to B2 nix-cache and nix-cache/a-box/main
#
# Bucket credentials reach only the Upload step. Keep them in environment "storage", so no other
# job can read them.
# Secrets: NIX_SIGNING_KEY; environment storage: B2_KEY_ID, B2_APPLICATION_KEY. Variables: B2_BUCKET.

name: publish

on:
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Build
        run: |
          nix-build -A toplevel -o result-toplevel
          nix-build -A publish.stage -o result-stage

      - name: Stage
        env:
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
        run: |
          export A_BOX_SIGNING_KEY="$RUNNER_TEMP/cache.sec"
          (umask 077 && printf '%s' "$NIX_SIGNING_KEY" >"$A_BOX_SIGNING_KEY")
          ./result-stage/bin/a-box-stage result-toplevel "$RUNNER_TEMP/stage"
          rm "$A_BOX_SIGNING_KEY"

      # NARs are zstd already.
      - uses: actions/upload-artifact@v7
        with:
          name: stage
          path: ${{ runner.temp }}/stage
          if-no-files-found: error
          compression-level: 0

  upload:
    needs: build
    runs-on: ubuntu-24.04
    environment: storage
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      # The uploader comes from this commit, never from the artifact.
      - name: Prepare
        run: nix-build -A publish.upload -o result-upload

      - uses: actions/download-artifact@v8
        with:
          name: stage
          path: ${{ runner.temp }}/stage

      - name: Upload
        env:
          RCLONE_CONFIG_B2_TYPE: b2
          RCLONE_CONFIG_B2_ACCOUNT: ${{ secrets.B2_KEY_ID }}
          RCLONE_CONFIG_B2_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          A_BOX_CACHE_DEST: b2:${{ vars.B2_BUCKET }}/nix-cache
          A_BOX_POINTER_DEST: b2:${{ vars.B2_BUCKET }}/nix-cache/a-box/main
        run: ./result-upload/bin/a-box-upload "$RUNNER_TEMP/stage"
